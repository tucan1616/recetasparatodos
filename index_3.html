<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recetario</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{--bg:#F1F5EE;--surface:#fff;--ink:#1D2A1B;--muted:#5B6B57;--line:#D5DECF;--brand:#2E5A34;--brand-ink:#fff;--accent:#F0B323;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151B14;--surface:#1F281D;--ink:#E8EFE4;--muted:#9DB097;--line:#33422F;--brand:#7FC48A;--brand-ink:#10200F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151B14;--surface:#1F281D;--ink:#E8EFE4;--muted:#9DB097;--line:#33422F;--brand:#7FC48A;--brand-ink:#10200F;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;line-height:1.5}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 48px}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;line-height:1.1;margin:0}
h1{font-size:clamp(2rem,6vw,3rem);font-weight:800;letter-spacing:-.02em}
.sub{color:var(--muted);margin:6px 0 18px}
input[type=search]{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px}
.chip{flex:none;padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:transparent}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:14px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;padding:0;display:block;width:100%}
.tile{height:120px;display:grid;place-items:center;font-size:3.4rem}
.card .body{padding:12px 14px 14px}
.card h3{font-size:1.2rem;font-weight:700}
.meta{color:var(--muted);font-size:.9rem;margin-top:4px}
.fav{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:50%;border:none;background:var(--surface);font-size:1.15rem;line-height:1}
.empty{padding:40px 0;color:var(--muted);text-align:center}
.back{border:none;background:none;padding:8px 0;color:var(--brand);font-weight:600}
.hero{display:flex;gap:16px;align-items:center;margin:8px 0 18px}
.hero .tile{flex:none;width:96px;height:96px;border-radius:16px;font-size:3rem}
.cols{display:grid;gap:24px;grid-template-columns:1fr}
@media(min-width:720px){.cols{grid-template-columns:5fr 7fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.panel h2{font-size:1.3rem;margin-bottom:10px}
.stepper{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.stepper button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:transparent;font-size:1.2rem}
.ing{list-style:none;margin:0;padding:0}
.ing li{border-bottom:1px solid var(--line)}
.ing li:last-child{border:none}
.ing label{display:flex;gap:10px;padding:9px 0;cursor:pointer}
.ing input{accent-color:var(--brand);width:18px;height:18px;margin-top:3px}
.ing input:checked+span{text-decoration:line-through;color:var(--muted)}
ol.steps{margin:0;padding-left:1.3rem}
ol.steps li{padding:6px 0 10px 4px}
ol.steps li::marker{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;color:var(--brand)}
.theme{float:right;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:.9rem}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.pill{border:1.5px solid var(--brand);background:transparent;color:var(--brand);border-radius:999px;padding:8px 14px;font-weight:600}
.pill.solid{background:var(--brand);color:var(--brand-ink)}
.fld{display:block;margin:0 0 14px;font-weight:600}
.fld small{display:block;font-weight:400;color:var(--muted)}
.fld input,.fld select,.fld textarea{display:block;width:100%;margin-top:6px;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;font-weight:400}
.row2{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.tm{margin-left:8px;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:2px 10px;font-size:.85rem;font-variant-numeric:tabular-nums}
.tm.on{background:var(--accent);border-color:var(--accent);color:#1D2A1B}
#tbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:#1D2A1B;color:#F1F5EE;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:none;gap:18px;overflow-x:auto}
#tbar.show{display:flex}
#tbar .t{flex:none;display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
#tbar .t.done{color:var(--accent)}
#tbar button{border:1px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:2px 10px}
body.hastimer .wrap{padding-bottom:110px}
.msg{color:var(--brand);font-weight:600;margin:8px 0 0}
.addrow{display:flex;gap:8px;margin:12px 0}
.addrow input{flex:1;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
.shopi{display:flex;align-items:center;justify-content:space-between;gap:8px}
.shopi label{flex:1}
.x{border:none;background:transparent;color:var(--muted);font-size:1.1rem;width:36px;height:36px}
@media(prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:hover{transform:translateY(-2px)}}
.banner{height:220px;border-radius:16px;margin:8px 0 14px;background-color:var(--line)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id='tbar'></div>
<script>
const R=[
{id:1,n:"Paella de pollo y verduras",e:"🥘",c:"Principales",t:60,s:4,bg:"#F6D77A",
i:[[400,"g","arroz bomba"],[600,"g","pollo troceado"],[200,"g","judía verde plana"],[150,"g","garrofón"],[1,"ud","tomate rallado"],[1,"pizca","azafrán"],[80,"ml","aceite de oliva"],[1.2,"l","agua"],[1,"cdta","sal"]],
p:["Sofríe el pollo en la paellera con el aceite hasta que dore bien.","Añade la judía verde y el garrofón y rehoga unos minutos.","Incorpora el tomate rallado y cocina hasta que pierda el agua.","Vierte el agua caliente con el azafrán y la sal. Hierve 15 minutos.","Reparte el arroz de forma uniforme y cuece 18 minutos sin remover.","Apaga el fuego y deja reposar 5 minutos antes de servir."]},
{id:2,n:"Tortilla de patatas",e:"🍳",c:"Principales",t:40,s:4,bg:"#F2E2A4",
i:[[6,"ud","huevos"],[600,"g","patatas"],[1,"ud","cebolla"],[200,"ml","aceite de oliva"],[1,"cdta","sal"]],
p:["Pela las patatas, córtalas en láminas finas y pica la cebolla.","Fríelas a fuego medio-bajo en el aceite hasta que estén tiernas. Escúrrelas.","Bate los huevos con la sal y mézclalos con las patatas. Déjalo reposar 5 minutos.","Cuaja la mezcla en una sartén con un poco de aceite, 3 minutos por lado.","Dale la vuelta con ayuda de un plato y termina al gusto de jugosidad."]},
{id:3,n:"Gazpacho andaluz",e:"🍅",c:"Entrantes",t:15,s:4,bg:"#F4B8A6",
i:[[1,"kg","tomates maduros"],[1,"ud","pepino"],[1,"ud","pimiento verde"],[1,"diente","ajo"],[80,"ml","aceite de oliva"],[2,"cda","vinagre"],[1,"cdta","sal"]],
p:["Trocea todas las verduras y ponlas en el vaso de la batidora.","Añade el ajo, el vinagre y la sal. Tritura hasta que quede fino.","Con la batidora en marcha, añade el aceite en hilo para emulsionar.","Cuela si prefieres textura suave y enfría al menos 2 horas."]},
{id:4,n:"Crema de calabaza",e:"🎃",c:"Entrantes",t:35,s:4,bg:"#F7C98B",
i:[[800,"g","calabaza"],[1,"ud","puerro"],[1,"ud","patata"],[700,"ml","caldo de verduras"],[100,"ml","nata para cocinar"]],
p:["Trocea la calabaza, el puerro y la patata.","Sofríe el puerro 5 minutos y añade el resto de verduras.","Cubre con el caldo y cuece 20 minutos hasta que todo esté tierno.","Tritura, añade la nata y calienta un minuto más."]},
{id:5,n:"Espaguetis al pesto",e:"🍝",c:"Principales",t:20,s:4,bg:"#BFE0B4",
i:[[320,"g","espaguetis"],[40,"g","albahaca fresca"],[30,"g","piñones"],[50,"g","parmesano rallado"],[1,"diente","ajo"],[100,"ml","aceite de oliva"]],
p:["Cuece la pasta en agua con sal y reserva un vaso del agua de cocción.","Tritura la albahaca, los piñones, el ajo, el parmesano y el aceite.","Mezcla la pasta escurrida con el pesto y un chorrito del agua reservada."]},
{id:6,n:"Tarta de queso al horno",e:"🍰",c:"Postres",t:75,s:8,bg:"#F3D6E0",
i:[[600,"g","queso crema"],[4,"ud","huevos"],[180,"g","azúcar"],[300,"ml","nata para montar"],[20,"g","harina"]],
p:["Precalienta el horno a 200 °C y forra un molde de 20 cm con papel de horno.","Mezcla el queso con el azúcar y añade los huevos de uno en uno.","Incorpora la nata y la harina tamizada hasta obtener una crema lisa.","Hornea 40 minutos: debe quedar tostada por fuera y temblorosa por dentro.","Enfría y refrigera 4 horas antes de desmoldar."]},
{id:7,n:"Arroz blanco",e:"🍚",c:"Contornos",t:25,s:4,bg:"#E3EBD9",
i:[[300,"g","arroz"],[600,"ml","agua"],[2,"cda","aceite de oliva"],[1,"diente","ajo"],[1,"cdta","sal"]],
p:["Calienta el aceite en un cazo y sofríe el diente de ajo entero hasta que huela.","Añade el arroz y rehógalo 2 minutos, sin que llegue a tomar color.","Vierte el agua caliente con la sal y lleva a ebullición.","Baja el fuego al mínimo, tapa y cuece 15 minutos sin destapar.","Retira del fuego y deja reposar 5 minutos tapado. Desgrana con un tenedor."]}
];
const CATS=["Todas","Entrantes","Principales","Ensaladas","Contornos","Postres","Favoritas"];
let st={q:'',cat:'Todas',open:null,sv:4,done:{},fav:[],shop:[],msg:''},custom=[],timers={},actx=null,tlast='';
try{st.fav=JSON.parse(localStorage.getItem("fav")||"[]")}catch(e){}
try{st.shop=JSON.parse(localStorage.getItem('shop')||'[]')}catch(e){}
try{custom=JSON.parse(localStorage.getItem('custom')||'[]');R.push(...custom)}catch(e){}
let photos={};try{photos=JSON.parse(localStorage.getItem('photos')||'{}')||{}}catch(e){}
function tile(r){const p=photos[r.id];return p?`<div class="tile" style="background:#ddd center/cover no-repeat url('${p}')" role="img" aria-label="Foto de ${r.n}"></div>`:`<div class="tile" style="background:${r.bg}">${r.e}</div>`}
function savePhotos(){try{localStorage.setItem('photos',JSON.stringify(photos));return true}catch(e){return false}}
function addPhoto(f){const m=document.getElementById('pm'),id=st.open;if(!f)return;if(!/^image\//.test(f.type)){m.textContent='Elige un archivo de imagen.';return}
const rd=new FileReader();rd.onerror=()=>{m.textContent='No se pudo leer la foto.'};
rd.onload=()=>{const im=new Image();im.onerror=()=>{m.textContent='No se pudo abrir esa imagen. Prueba con una JPG o PNG.'};
im.onload=()=>{const s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);const old=photos[id];photos[id]=c.toDataURL('image/jpeg',.8);
if(!savePhotos()){if(old)photos[id]=old;else delete photos[id];m.textContent='No cabe: el navegador no tiene espacio para más fotos. Quita alguna foto e inténtalo de nuevo.';return}
const y=window.scrollY;if(st.open===id)detail();window.scrollTo(0,y)};im.src=rd.result};rd.readAsDataURL(f)}
function save(){try{localStorage.setItem('fav',JSON.stringify(st.fav));localStorage.setItem('shop',JSON.stringify(st.shop));localStorage.setItem('custom',JSON.stringify(custom))}catch(e){}}
function num(x){x=Math.round(x*10)/10;return String(x).replace(".",",")}
const app=document.getElementById("app");
function themeBtn(){return '<button class="theme" data-a="theme">Cambiar tema</button>'}
function nz(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/&amp;/g,'&').toLowerCase()}
function stem(w){return w.length>3?w.replace(/(es|s)$/,''):w}
function filt(all){const ws=nz(st.q).split(/[\s,;]+/).filter(Boolean).map(stem);return R.filter(r=>(all||st.cat==="Todas"||(st.cat==="Favoritas"?st.fav.includes(r.id):r.c===st.cat))&&(!ws.length||ws.every(w=>nz(r.n+" "+r.i.map(i=>i[2]).join(" ")).includes(w))))}
function resHTML(){const rs=filt(),n=(!rs.length&&st.cat!=="Todas"&&st.q.trim())?filt(true).length:0;return `<div class="grid">${rs.map(r=>`<div style="position:relative"><button class="card" data-a="open" data-v="${r.id}">${tile(r)}<div class="body"><h3>${r.n}</h3><div class="meta">${r.t} min · ${r.s} raciones</div></div></button><button class="fav" data-a="fav" data-v="${r.id}" aria-label="${st.fav.includes(r.id)?"Quitar de favoritas":"Guardar en favoritas"}">${st.fav.includes(r.id)?"♥":"♡"}</button></div>`).join("")}</div>
  ${rs.length?"":'<div class="empty">No hay recetas con esos filtros. Prueba con otro ingrediente o con menos ingredientes.</div>'}${n?`<p style="text-align:center"><button class="pill solid" data-a="cat" data-v="Todas">Buscar en todas las categorías (${n})</button></p>`:''}`}
function list(){
  app.innerHTML=`${themeBtn()}<h1>Recetario</h1><p class="sub">Busca por plato o por ingrediente.</p><div class='bar'><button class='pill solid' data-a='new'>+ Nueva receta</button><button class='pill' data-a='shop'>🛒 Lista de la compra (${st.shop.length})</button></div>
  <input type="search" id="q" placeholder="Buscar: arroz, huevos, tomate…" aria-label="Buscar recetas" value="${st.q.replace(/"/g,"&quot;")}">
  <div class="chips">${CATS.map(c=>`<button class="chip" data-a="cat" data-v="${c}" aria-pressed="${st.cat===c}">${c}</button>`).join("")}</div>
  <div id="res">${resHTML()}</div>`;
  const qi=document.getElementById("q");
  qi.addEventListener("input",e=>{st.q=e.target.value;document.getElementById("res").innerHTML=resHTML()});
}
function detail(){
  const r=R.find(x=>x.id===st.open),k=st.sv/r.s,d=st.done[r.id]||(st.done[r.id]={});
  app.innerHTML=`<button class="back" data-a="back">‹ Volver a las recetas</button>
  ${photos[r.id]?`<div class="banner" style="background:url('${photos[r.id]}') center/cover no-repeat" role="img" aria-label="Foto de ${r.n}"></div>`:''}<div class="hero">${photos[r.id]?'':tile(r)}<div><h1>${r.n}</h1><div class="meta">${r.c} · ${r.t} min</div></div></div>
  <div class="bar"><button class="pill" data-a="photo">📷 ${photos[r.id]?'Cambiar foto':'Añadir foto'}</button>${photos[r.id]?'<button class="pill" data-a="rmphoto">Quitar foto</button>':''}</div><input type="file" id="pf" accept="image/*" hidden><p class="msg" id="pm" role="alert"></p>
  <div class="cols"><section class="panel"><h2>Ingredientes</h2>
  <div class="stepper"><button data-a="sv" data-v="-1" aria-label="Menos raciones">−</button><strong>${st.sv} raciones</strong><button data-a="sv" data-v="1" aria-label="Más raciones">+</button></div>
  <ul class="ing">${r.i.map((x,j)=>`<li><label><input type="checkbox" data-a="chk" data-v="${j}" ${d[j]?"checked":""}><span>${fmt(x[0]*k,x[1],x[2])}</span></label></li>`).join("")}</ul><p class='meta'>Marca los que ya tienes en casa.</p><button class='pill solid' data-a='addshop'>🛒 Añadir los que me faltan a la lista</button><p class='msg' role='status'>${st.msg}</p></section>
  <section class="panel"><h2>Preparación</h2><ol class="steps">${r.p.map((s,j)=>`<li>${s}${tbtn(r,j,s)}</li>`).join("")}</ol></section></div>${r.cu?'<p><button class="pill" data-a="delrec">Eliminar esta receta</button></p>':''}`;
  window.scrollTo(0,0);
}
const UN=/^(g|kg|mg|ml|l|cl|cda|cdas|cdta|cdtas|ud|uds|diente|dientes|pizca|pizcas|taza|tazas|vaso|vasos|lata|latas|loncha|lonchas|rama|ramas|puñado|hoja|hojas)$/i;
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmt(a,u,n){return a?num(a)+' '+(u&&u!=='ud'?u+' de ':'')+n:n}
function ing(l){const p=l.trim().split(/\s+/),f=p[0].match(/^(\d+)\/(\d+)$/),a=f?f[1]/f[2]:parseFloat(p[0].replace(',','.'));if(isNaN(a))return[0,'',esc(l.trim())];if(p.length>2&&UN.test(p[1]))return[a,/^uds?$/i.test(p[1])?'':p[1].toLowerCase(),esc(p.slice(2).join(' '))];return[a,'',esc(p.slice(1).join(' '))]}
function mins(s){let m=0;const x=s.match(/(\d+)\s*(?:minutos?|min)\b/i),h=s.match(/(\d+)\s*horas?\b/i);if(x)m+=+x[1];if(h)m+=+h[1]*60;return m}
function lab(m){return m>=60?Math.floor(m/60)+' h'+(m%60?' '+m%60+' min':''):m+' min'}
function clk(s){s=Math.max(0,Math.ceil(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),z=n=>String(n).padStart(2,'0');return (h?h+':'+z(m):m)+':'+z(s%60)}
function tbtn(r,j,s){const m=mins(s);if(!m)return'';const k=r.id+'-'+j,t=timers[k];return ` <button class='tm${t?' on':''}' data-a='tm' data-v='${k}' data-m='${m}' data-tk='${k}'>${t?(t.done?'¡Listo!':clk((t.end-Date.now())/1000)):'⏱ '+lab(m)}</button>`}
function toggleTimer(b){const k=b.dataset.v;if(timers[k])delete timers[k];else{const r=R.find(x=>x.id===st.open);try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(e){}timers[k]={end:Date.now()+ +b.dataset.m*60000,n:r.n,p:+k.split('-')[1]+1,done:false}}updT()}
function beep(){try{for(let i=0;i<3;i++){const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.frequency.value=880;g.gain.value=.2;o.start(actx.currentTime+i*.5);o.stop(actx.currentTime+i*.5+.25)}}catch(e){}try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}}
function updT(){const now=Date.now(),ks=Object.keys(timers);for(const k of ks){const t=timers[k];if(!t.done&&now>=t.end){t.done=true;beep()}}
document.querySelectorAll('[data-tk]').forEach(el=>{const t=timers[el.dataset.tk];el.classList.toggle('on',!!t);el.textContent=t?(t.done?'¡Listo!':clk((t.end-now)/1000)):'⏱ '+lab(+el.dataset.m)});
const bar=document.getElementById('tbar'),sig=ks.map(k=>k+timers[k].done).join();bar.classList.toggle('show',ks.length>0);document.body.classList.toggle('hastimer',ks.length>0);
if(sig!==tlast){tlast=sig;bar.innerHTML=ks.map(k=>{const t=timers[k];return `<div class='t${t.done?' done':''}'><span>${t.n}, paso ${t.p}:</span><strong data-k='${k}'>${t.done?'¡Tiempo!':''}</strong><button data-a='tmx' data-v='${k}'>${t.done?'Cerrar':'Cancelar'}</button></div>`}).join('')}
bar.querySelectorAll('strong[data-k]').forEach(s=>{const t=timers[s.dataset.k];if(t&&!t.done)s.textContent=clk((t.end-now)/1000)})}
setInterval(()=>{if(Object.keys(timers).length)updT()},1000);
function form(){app.innerHTML=`<button class='back' data-a='back'>‹ Volver a las recetas</button><h1>Nueva receta</h1><p class='sub'>Se guarda en este navegador.</p><label class='fld'>Nombre<input id='fn' maxlength='60' placeholder='Ej.: Lentejas de la abuela'></label><div class='row2'><label class='fld'>Categoría<select id='fc'><option>Entrantes</option><option selected>Principales</option><option>Ensaladas</option><option>Contornos</option><option>Postres</option></select></label><label class='fld'>Minutos<input id='ft' type='number' min='1' value='30'></label><label class='fld'>Raciones<input id='fs' type='number' min='1' value='4'></label></div><label class='fld'>Ingredientes<small>Uno por línea: cantidad, unidad e ingrediente. Ej.: 200 g harina · 2 huevos</small><textarea id='fi' rows='6'></textarea></label><label class='fld'>Pasos<small>Uno por línea. Si escribes «10 minutos» o «2 horas», se crea un temporizador.</small><textarea id='fp' rows='6'></textarea></label><button class='pill solid' data-a='saverec'>Guardar receta</button><p class='msg' id='fm' role='alert'></p>`;window.scrollTo(0,0)}
function saveRec(){const g=i=>document.getElementById(i).value.trim(),n=esc(g('fn')),is=g('fi').split('\n').map(ing).filter(x=>x[2]),ps=g('fp').split('\n').map(x=>esc(x.trim())).filter(Boolean),m=document.getElementById('fm');if(!n||!is.length||!ps.length){m.textContent='Falta el nombre, algún ingrediente o algún paso.';return}const id=Math.max(100,...custom.map(x=>x.id+1)),E=['🥗','🍲','🥧','🍛','🥪','🧁'],B=['#BFE0B4','#F6D77A','#F4B8A6','#F3D6E0','#F7C98B','#C9DDF0'],r={id,n,e:E[id%6],c:g('fc'),t:+g('ft')||30,s:Math.max(1,+g('fs')||4),bg:B[id%6],i:is,p:ps,cu:1};custom.push(r);R.push(r);save();st.cat='Todas';st.q='';st.open=id;st.sv=r.s;st.msg='';detail()}
function addShop(){const r=R.find(x=>x.id===st.open),k=st.sv/r.s,d=st.done[r.id]||{};let c=0;r.i.forEach((x,j)=>{if(d[j])return;c++;const key=x[2].toLowerCase()+'|'+x[1],it=st.shop.find(y=>y.k===key&&!y.d);if(it)it.a+=x[0]*k;else st.shop.push({k:key,a:x[0]*k,u:x[1],n:x[2],d:false})});st.msg=c?'Lista actualizada: +'+c+(c===1?' ingrediente.':' ingredientes.'):'Ya tienes todos los ingredientes marcados.';save()}
function shop(){app.innerHTML=`<button class='back' data-a='back'>‹ Volver a las recetas</button><h1>Lista de la compra</h1><div class='addrow'><input id='sin' placeholder='Añadir producto (ej.: 2 limones)' aria-label='Añadir producto'><button class='pill solid' data-a='sadd'>Añadir</button></div>${st.shop.length?`<section class='panel'><ul class='ing'>${st.shop.map((x,i)=>`<li class='shopi'><label><input type='checkbox' data-a='schk' data-v='${i}' ${x.d?'checked':''}><span>${fmt(x.a,x.u,x.n)}</span></label><button class='x' data-a='sdel' data-v='${i}' aria-label='Quitar'>✕</button></li>`).join('')}</ul></section><div class='bar' style='margin-top:14px'><button class='pill' data-a='sclr'>Quitar marcados</button><button class='pill' data-a='sall'>Vaciar lista</button></div>`:`<div class='empty'>Tu lista está vacía. Abre una receta y añade los ingredientes que te faltan.</div>`}`;window.scrollTo(0,0)}
function addItem(){const i=document.getElementById('sin'),v=i.value.trim();if(!v)return;const x=ing(v),it=x[2]?x:[0,'',esc(v)];st.shop.push({k:it[2].toLowerCase()+'|'+it[1],a:it[0],u:it[1],n:it[2],d:false});save();shop();document.getElementById('sin').focus()}
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='sin')addItem()});
app.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a,v=b.dataset.v;
  if(a==="cat"){st.cat=v;list()}
  else if(a==="open"){st.open=+v;st.msg='';st.sv=R.find(x=>x.id===+v).s;detail()}
  else if(a==='photo'){document.getElementById('pf').click()}
  else if(a==='rmphoto'){delete photos[st.open];savePhotos();const y=window.scrollY;detail();window.scrollTo(0,y)}
  else if(a==='new'){form()}
  else if(a==='shop'){shop()}
  else if(a==='saverec'){saveRec()}
  else if(a==='delrec'){const i=R.findIndex(x=>x.id===st.open);if(i>-1)R.splice(i,1);custom=custom.filter(x=>x.id!==st.open);st.fav=st.fav.filter(x=>x!==st.open);save();delete photos[st.open];savePhotos();st.open=null;list()}
  else if(a==='addshop'){addShop();const y=window.scrollY;detail();window.scrollTo(0,y)}
  else if(a==='tm'){toggleTimer(b)}
  else if(a==='tmx'){delete timers[v];updT()}
  else if(a==='sadd'){addItem()}
  else if(a==='sdel'){st.shop.splice(+v,1);save();shop()}
  else if(a==='sclr'){st.shop=st.shop.filter(x=>!x.d);save();shop()}
  else if(a==='sall'){st.shop=[];save();shop()}
  else if(a==="back"){st.open=null;list()}
  else if(a==="fav"){const i=+v;st.fav=st.fav.includes(i)?st.fav.filter(x=>x!==i):[...st.fav,i];save();list()}
  else if(a==="sv"){st.sv=Math.max(1,Math.min(24,st.sv+ +v));const y=window.scrollY;detail();window.scrollTo(0,y)}
  else if(a==="theme"){const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dark?"light":"dark"}
});
app.addEventListener("change",e=>{if(e.target.id==='pf'){addPhoto(e.target.files&&e.target.files[0]);return}if(e.target.dataset.a==="chk"){(st.done[st.open]||(st.done[st.open]={}))[e.target.dataset.v]=e.target.checked}else if(e.target.dataset.a==='schk'){st.shop[+e.target.dataset.v].d=e.target.checked;save()}});
list();
</script>
</body>
</html>
